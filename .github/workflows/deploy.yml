name: Deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure production
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require the deploy checkbox
        run: |
          if [ "${{ github.event.inputs.deploy }}" != "true" ]; then
            echo "Check Deploy to Azure production, then click Run workflow again."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.WEB_BASE_URL || 'https://app-grabbike-web.azurewebsites.net' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Version this commit
        id: meta
        run: |
          echo "version=v1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a green Build and CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          bash .github/scripts/require-green.sh "$SHA" build.yml
          bash .github/scripts/require-green.sh "$SHA" ci.yml

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Publish the API
        run: dotnet publish src/GrabBike.Api/GrabBike.Api.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish/api

      - name: Build the web app
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://app-grabbike-api.azurewebsites.net' }}
        run: |
          npm ci
          npm run build
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prepare App Service and API/web monitoring
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_SERVICE_PLAN: ${{ vars.AZURE_APP_SERVICE_PLAN }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP_NAME }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          AZURE_APPLICATION_INSIGHTS: ${{ vars.AZURE_APPLICATION_INSIGHTS }}
          AZURE_LOG_ANALYTICS_WORKSPACE: ${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}
          AZURE_LOG_RETENTION_DAYS: ${{ vars.AZURE_LOG_RETENTION_DAYS }}
          AZURE_LOG_DAILY_CAP_GB: ${{ vars.AZURE_LOG_DAILY_CAP_GB }}
        run: bash .github/scripts/deploy-azure.sh

      - name: Deploy Postgres and Service Bus
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP_NAME }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP_NAME }}
          MAPS_PROVIDER: ${{ vars.MAPS_PROVIDER }}
          VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
          VIETMAP_TILEMAP_KEY: ${{ secrets.VIETMAP_TILEMAP_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_API_CLIENT_ID: ${{ vars.AZURE_API_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_API_SCOPE: ${{ vars.AZURE_API_SCOPE }}
        run: |
          if [ -z "$POSTGRES_ADMIN_PASSWORD" ]; then
            echo "POSTGRES_ADMIN_PASSWORD is not set. The API requires Azure Postgres, so deployment stops here."
            exit 1
          fi
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}" \
            --name grabbike \
            --template-file infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" location="${AZURE_LOCATION:-southeastasia}" \
            --query properties.outputs \
            --output json > infra-outputs.json
          host="$(python3 -c 'import json; print(json.load(open("infra-outputs.json"))["postgresHost"]["value"])')"
          namespace="$(python3 -c 'import json; print(json.load(open("infra-outputs.json"))["serviceBusNamespaceName"]["value"])')"
          bus="$(az servicebus queue authorization-rule keys list --resource-group "${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}" --namespace-name "$namespace" --queue-name dispatch --name dispatch-worker --query primaryConnectionString -o tsv)"
          provider="${MAPS_PROVIDER:-}"
          if [ -z "$provider" ]; then
            provider="Fake"
            if [ -n "$VIETMAP_API_KEY" ] && [ -n "$VIETMAP_TILEMAP_KEY" ]; then
              provider="VietMap"
            elif [ -n "$GOOGLE_MAPS_API_KEY" ] && [ -n "$GOOGLE_MAPS_BROWSER_KEY" ]; then
              provider="Google"
            fi
          fi
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}" \
            --name "${AZURE_API_APP:-app-grabbike-api}" \
            --settings \
              ConnectionStrings__GrabBike="Host=${host};Database=happyride;Username=happyride;Password=${POSTGRES_ADMIN_PASSWORD};SSL Mode=Require" \
              Dispatch__Bus="ServiceBus" \
              ServiceBus__ConnectionString="$bus" \
              ServiceBus__Queue="dispatch" \
              Maps__Provider="$provider" \
              Maps__VietMap__ApiKey="$VIETMAP_API_KEY" \
              Maps__VietMap__TileKey="$VIETMAP_TILEMAP_KEY" \
              Maps__Google__ApiKey="$GOOGLE_MAPS_API_KEY" \
              Maps__Google__BrowserKey="$GOOGLE_MAPS_BROWSER_KEY" \
              Sim__Enabled="true"
          if [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_API_CLIENT_ID:-}" ] && [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "Entra settings stay unchanged until the API package is deployed and can accept the current token."
          else
            echo "Entra application token is not configured. Clearing any stored Entra settings so the API does not keep a stale token requirement."
            rg="${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}"
            delete_settings() {
              local app="$1"
              shift
              local existing
              existing="$(az webapp config appsettings list --resource-group "$rg" --name "$app" --query "[].name" -o tsv)"
              local remove=()
              local name
              for name in "$@"; do
                if printf '%s\n' "$existing" | grep -Fxq "$name"; then
                  remove+=("$name")
                fi
              done
              if [ "${#remove[@]}" -gt 0 ]; then
                az webapp config appsettings delete --resource-group "$rg" --name "$app" --setting-names "${remove[@]}"
              fi
            }
            delete_settings "${AZURE_API_APP:-app-grabbike-api}" \
              AzureAd__TenantId AzureAd__ClientId AzureAd__Audience AzureAd__AllowedClientId \
              AzureAd__PreviousTenantId AzureAd__PreviousClientId AzureAd__PreviousAudience AzureAd__PreviousAllowedClientId
            delete_settings "${AZURE_WEB_APP:-app-grabbike-web}" \
              AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_API_CLIENT_ID AZURE_API_SCOPE
          fi
          rm -f infra-outputs.json

      - name: Deploy the API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME || 'app-grabbike-api' }}
          package: publish/api

      - name: Accept the current and new Entra identities
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_API_CLIENT_ID: ${{ vars.AZURE_API_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_API_SCOPE: ${{ vars.AZURE_API_SCOPE }}
        run: |
          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_API_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "Entra application token is not configured."
            exit 0
          fi
          rg="${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}"
          api="${AZURE_API_APP:-app-grabbike-api}"
          setting() {
            az webapp config appsettings list --resource-group "$rg" --name "$1" --query "[?name=='$2'].value | [0]" -o tsv
          }
          same() { [ "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')" ]; }
          old_tenant="$(setting "$api" AzureAd__TenantId)"
          old_client="$(setting "$api" AzureAd__ClientId)"
          old_audience="$(setting "$api" AzureAd__Audience)"
          old_allowed="$(setting "$api" AzureAd__AllowedClientId)"
          new_allowed="${AZURE_CLIENT_ID:-$AZURE_API_CLIENT_ID}"
          new_scope="${AZURE_API_SCOPE:-api://${AZURE_API_CLIENT_ID}/.default}"
          new_audience="${new_scope%/.default}"
          if [ -n "$old_tenant" ] && { ! same "$old_tenant" "$AZURE_TENANT_ID" || ! same "$old_client" "$AZURE_API_CLIENT_ID" || ! same "$old_audience" "$new_audience" || ! same "$old_allowed" "$new_allowed"; }; then
            overlap=(
              AzureAd__TenantId="$AZURE_TENANT_ID"
              AzureAd__ClientId="$AZURE_API_CLIENT_ID"
              AzureAd__Audience="$new_audience"
              AzureAd__AllowedClientId="$new_allowed"
            )
            if ! same "$old_tenant" "$AZURE_TENANT_ID"; then
              overlap+=(
                AzureAd__PreviousTenantId="$old_tenant"
                AzureAd__PreviousClientId="$old_client"
                AzureAd__PreviousAudience="$old_audience"
                AzureAd__PreviousAllowedClientId="$old_allowed"
              )
            else
              if ! same "$old_client" "$AZURE_API_CLIENT_ID"; then overlap+=(AzureAd__PreviousClientId="$old_client"); fi
              if ! same "$old_audience" "$new_audience"; then overlap+=(AzureAd__PreviousAudience="$old_audience"); fi
              if ! same "$old_allowed" "$new_allowed"; then overlap+=(AzureAd__PreviousAllowedClientId="$old_allowed"); fi
            fi
            az webapp config appsettings set --resource-group "$rg" --name "$api" --settings "${overlap[@]}"
            stale=()
            if same "$old_tenant" "$AZURE_TENANT_ID"; then
              stale+=(AzureAd__PreviousTenantId)
              if same "$old_client" "$AZURE_API_CLIENT_ID"; then stale+=(AzureAd__PreviousClientId); fi
              if same "$old_audience" "$new_audience"; then stale+=(AzureAd__PreviousAudience); fi
              if same "$old_allowed" "$new_allowed"; then stale+=(AzureAd__PreviousAllowedClientId); fi
            fi
            if [ "${#stale[@]}" -gt 0 ]; then
              existing="$(az webapp config appsettings list --resource-group "$rg" --name "$api" --query "[].name" -o tsv)"
              drop=()
              for name in "${stale[@]}"; do
                if printf '%s\n' "$existing" | grep -Fxq "$name"; then drop+=("$name"); fi
              done
              if [ "${#drop[@]}" -gt 0 ]; then
                az webapp config appsettings delete --resource-group "$rg" --name "$api" --setting-names "${drop[@]}"
              fi
            fi
          fi

      - name: Stop the web app
        run: |
          az webapp stop \
            --resource-group "${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}" \
            --name "${AZURE_WEB_APP:-app-grabbike-web}"

      - name: Deploy the web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME || 'app-grabbike-web' }}
          package: web/.next/standalone
          clean: true
          restart: false

      - name: Apply the web Entra settings
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_API_CLIENT_ID: ${{ vars.AZURE_API_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_API_SCOPE: ${{ vars.AZURE_API_SCOPE }}
        run: |
          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_API_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "Entra application token is not configured."
            exit 0
          fi
          rg="${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}"
          web="${AZURE_WEB_APP:-app-grabbike-web}"
          setting() {
            az webapp config appsettings list --resource-group "$rg" --name "$1" --query "[?name=='$2'].value | [0]" -o tsv
          }
          same() { [ "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')" ]; }
          new_allowed="${AZURE_CLIENT_ID:-$AZURE_API_CLIENT_ID}"
          new_scope="${AZURE_API_SCOPE:-api://${AZURE_API_CLIENT_ID}/.default}"
          web_tenant="$(setting "$web" AZURE_TENANT_ID)"
          web_client="$(setting "$web" AZURE_CLIENT_ID)"
          web_secret="$(setting "$web" AZURE_CLIENT_SECRET)"
          web_api="$(setting "$web" AZURE_API_CLIENT_ID)"
          web_scope="$(setting "$web" AZURE_API_SCOPE)"
          if same "$web_tenant" "$AZURE_TENANT_ID" && same "$web_client" "$new_allowed" && [ "$web_secret" = "$AZURE_CLIENT_SECRET" ] && same "$web_api" "$AZURE_API_CLIENT_ID" && [ "$web_scope" = "$new_scope" ]; then
            echo "Web Entra settings already match."
          else
            az webapp config appsettings set \
              --resource-group "$rg" \
              --name "$web" \
              --settings \
                AZURE_TENANT_ID="$AZURE_TENANT_ID" \
                AZURE_CLIENT_ID="$new_allowed" \
                AZURE_CLIENT_SECRET="$AZURE_CLIENT_SECRET" \
                AZURE_API_CLIENT_ID="$AZURE_API_CLIENT_ID" \
                AZURE_API_SCOPE="$new_scope"
          fi

      - name: Start the web app
        run: |
          az webapp start \
            --resource-group "${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}" \
            --name "${AZURE_WEB_APP:-app-grabbike-web}"

      - name: Keep only the new Entra identity
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_API_CLIENT_ID: ${{ vars.AZURE_API_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_API_SCOPE: ${{ vars.AZURE_API_SCOPE }}
        run: |
          if [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_API_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "Entra application token is not configured. The API keeps the cleared settings from the earlier step."
            exit 0
          fi
          rg="${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}"
          api="${AZURE_API_APP:-app-grabbike-api}"
          client_id="${AZURE_CLIENT_ID:-$AZURE_API_CLIENT_ID}"
          scope="${AZURE_API_SCOPE:-api://${AZURE_API_CLIENT_ID}/.default}"
          audience="${scope%/.default}"
          az webapp config appsettings set \
            --resource-group "$rg" \
            --name "$api" \
            --settings \
              AzureAd__TenantId="$AZURE_TENANT_ID" \
              AzureAd__ClientId="$AZURE_API_CLIENT_ID" \
              AzureAd__Audience="$audience" \
              AzureAd__AllowedClientId="$client_id"
          existing="$(az webapp config appsettings list --resource-group "$rg" --name "$api" --query "[].name" -o tsv)"
          remove=()
          for name in AzureAd__PreviousTenantId AzureAd__PreviousClientId AzureAd__PreviousAudience AzureAd__PreviousAllowedClientId; do
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              remove+=("$name")
            fi
          done
          if [ "${#remove[@]}" -gt 0 ]; then
            az webapp config appsettings delete --resource-group "$rg" --name "$api" --setting-names "${remove[@]}"
          fi

      - name: Publish the version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://app-grabbike-api.azurewebsites.net' }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://app-grabbike-web.azurewebsites.net' }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" \
              --target "$SHA" \
              --title "$VERSION" \
              --notes "Production deployment of ${SHA}. API: ${API_BASE_URL} Web: ${WEB_BASE_URL}"
          fi

      - name: Update the version badge
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/update-version-badge.py
          if git diff --quiet -- README.md; then
            echo "Version badge already current"
            exit 0
          fi
          git add README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Show production version ${VERSION}"
          git push origin HEAD:main || echo "Could not push the version badge. The release still records ${VERSION}."

      - name: Close the deployment request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://app-grabbike-api.azurewebsites.net' }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://app-grabbike-web.azurewebsites.net' }}
        run: |
          for number in $(gh issue list --label deployment-request --state open --json number --jq '.[].number'); do
            gh issue comment "$number" --body "Deployed ${VERSION}. API: ${API_BASE_URL} Web: ${WEB_BASE_URL}"
            gh issue close "$number" --reason completed
          done
