name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the API
        run: dotnet build happy-ride.sln --configuration Release

      - name: Test monitoring deployment configuration
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Test standalone web telemetry
        working-directory: web
        run: npm run test:server-telemetry
