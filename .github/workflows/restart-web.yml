name: Restart web

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    name: Restart the web app
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart
        run: az webapp restart --resource-group "${AZURE_RESOURCE_GROUP:-rg-grabbike-dev}" --name "${AZURE_WEB_APP:-app-grabbike-web}"
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP_NAME }}
